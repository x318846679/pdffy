<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF 翻译阅读器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="toolbar">
    <div class="toolbar-left">
        <label class="btn btn-primary">
            <input type="file" id="fileInput" accept="application/pdf" hidden>
            打开 PDF
        </label>
        <input type="text" id="urlInput" class="url-input" placeholder="或粘贴 PDF 链接后回车…">
        <span class="page-info" id="pageInfo">未加载</span>
    </div>

    <div class="toolbar-center">
        <select id="targetLang" class="select">
            <option value="zh-CN" selected>简体中文</option>
            <option value="zh-TW">繁体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="ru">Русский</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
        </select>

        <select id="mode" class="select">
            <option value="bilingual" selected>双语对照</option>
            <option value="target">仅译文</option>
            <option value="source">仅原文</option>
        </select>

        <button id="translatePageBtn" class="btn">翻译本页</button>
        <button id="translateAllBtn" class="btn btn-primary">自动翻译</button>
        <button id="clearBtn" class="btn">清除译文</button>
        <button id="stopBtn" class="btn btn-danger" disabled>停止</button>
    </div>

    <div class="toolbar-right">
        <button id="zoomOutBtn" class="btn" title="缩小">－</button>
        <span id="zoomLabel" class="page-info">100%</span>
        <button id="zoomInBtn" class="btn" title="放大">＋</button>
        <button id="zoomResetBtn" class="btn" title="适应宽度">适应</button>
        <input type="number" id="gotoInput" class="goto-input" min="1" placeholder="页">
        <button id="gotoBtn" class="btn">跳转</button>
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <span class="status" id="status">就绪</span>
    </div>
</div>

<div class="viewer" id="viewer">
    <div class="empty" id="emptyTip">
        <h2>选择或拖入一个 PDF 文件</h2>
        <p>加载后点「翻译本页 / 自动翻译」，译文会直接叠加显示在 PDF 上方；滚动浏览即按需渲染与翻译。</p>
    </div>
</div>

<script src="lib/pdf.min.js"></script>
<script src="viewer.js"></script>
</body>
</html>
